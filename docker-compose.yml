services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finance-data-copilot-postgres
    environment:
      POSTGRES_DB: finance_data_copilot
      POSTGRES_USER: finance_copilot
      POSTGRES_PASSWORD: finance_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_copilot -d finance_data_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: finance-data-copilot-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://finance_copilot:finance_copilot@postgres:5432/finance_data_copilot
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: finance-data-copilot-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
